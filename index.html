  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-brand" href="#/ajuda" aria-label="Central de Ajuda Sipclick">
        <img src="assets/media/logo-retangular.webp" alt="Sipclick RH" />
        <span class="hc-brand-sep" aria-hidden="true"></span>
        <span class="hc-brand-title">Central de <strong>Ajuda</strong></span>
      </a>

      <button class="hc-header-search" id="headerSearch" type="button" aria-label="Buscar na ajuda">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <span>Buscar na ajuda…</span>
        <kbd>/</kbd>
      </button>

      <div class="hc-header-actions">
        <label class="hc-role">
          <span>Ver como</span>
          <select id="roleSelect" aria-label="Visualizar a ajuda como">
            <option value="admin_rh">Admin / RH</option>
            <option value="gestor">Gestor</option>
            <option value="colaborador">Colaborador</option>
          </select>
        </label>
        <a class="hc-btn hc-btn--ghost hc-back-app" href="#/ajuda" title="No produto, este link volta para a última tela">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
          <span>Voltar ao sistema</span>
        </a>
        <span class="hc-avatar" aria-hidden="true">BP</span>
      </div>
    </div>
  </header>

  <div class="hc-shell">
    <aside class="hc-sidebar" id="sidebar" aria-label="Assuntos da ajuda"></aside>
    <main class="hc-main" id="conteudo" tabindex="-1"></main>
  </div>

  <footer class="hc-footer">
    <div class="hc-footer-inner">
      <span>Central de Ajuda Sipclick RH · protótipo para validação</span>
      <span class="hc-footer-tip">Atalho: pressione <kbd>?</kbd> em qualquer tela</span>
    </div>
  </footer>

  <button class="hc-fab" id="helpFab" type="button" aria-label="Abrir ajuda rápida" aria-haspopup="dialog">
    <svg class="icon" aria-hidden="true"><use href="#i-help"/></svg>
    <span>Ajuda</span>
  </button>

  <div class="hc-overlay" id="quickOverlay" hidden></div>
  <aside class="hc-panel" id="quickPanel" role="dialog" aria-modal="true" aria-labelledby="quickTitle" hidden>
    <div class="hc-panel-head">
      <div>
        <p class="hc-eyebrow">Atalho de ajuda</p>
        <h2 id="quickTitle">Como podemos ajudar?</h2>
      </div>
      <button class="hc-icon-btn" id="quickClose" type="button" aria-label="Fechar ajuda">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <form class="hc-panel-search" id="quickSearchForm" role="search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="quickSearch" type="search" placeholder="Busque por uma tarefa ou dúvida" autocomplete="off" aria-label="Buscar na ajuda rápida" />
    </form>
    <div class="hc-panel-body" id="quickBody"></div>
    <div class="hc-panel-foot">
      <a class="hc-btn hc-btn--primary" href="#/ajuda" id="openFullHelp">
        Abrir Central de Ajuda
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>
      </a>
      <span>Conteúdo para o seu papel</span>
    </div>
  </aside>

  <div class="hc-toast" id="toast" role="status" aria-live="polite"></div>

</html>
